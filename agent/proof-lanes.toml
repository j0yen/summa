# proof-lanes.toml — change-class -> required-lane routing.
# Generated by scripts/onboard-repo.sh (PRD-build-repo-onboard) from this
# repo's actual layout at onboarding time (summa v0.4.0).
# Shape mirrors mcphost's working agent/proof-lanes.toml (the reference
# scaffolding this fleet's gate assumes). Each lane has globs; a Stage-3
# advance requires every changed path to resolve to >=1 lane AND that
# lane's required_commands to be green.

[[lane]]
id = "rust-source"
description = "Behavior changes in src/ (generated by onboard-repo.sh from the repo's actual layout)"
globs = ["src/**/*.rs"]
required_commands = [
  "cargo check --workspace",
  "cargo clippy --workspace -- -D warnings",
  "cargo test --workspace",
]

[[lane]]
id = "rust-tests"
description = "Test-only changes, including fixture data consumed by tests/**/*.rs"
globs = ["tests/**/*.rs", "tests/fixtures/**"]
required_commands = [
  "cargo test --workspace",
]

[[lane]]
id = "deps"
description = "Cargo.toml / Cargo.lock changes"
globs = ["Cargo.toml", "Cargo.lock"]
required_commands = [
  "cargo check --workspace",
]

[[lane]]
id = "meta"
description = "Orchestrator-owned scaffold metadata (agent/** and repo hygiene). Not edit-agent-owned; no build proof applies, only intent-card schema validation."
globs = ["agent/**", ".gitignore", "CHANGELOG.md", "README.md", "LICENSE-*", "extended-gates.toml", "PRD-*.md"]
required_commands = [
  "autobuilder intake --validate agent/intent-card.json",
]
